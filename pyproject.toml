[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seion-music-lab"
version = "0.1.0"
description = "Local-first AI-assisted electronic music composition lab for FL Studio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SEION Music Lab" }]
keywords = ["music", "midi", "fl-studio", "composition", "ai", "electronic-music"]

# Core MVP dependencies. Deliberately small so the project installs fast and
# works fully offline (no LLM API calls required for deterministic generation).
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.0",
    "mido>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Optional HTTP API server (FastAPI). Not required for the CLI MVP.
server = ["fastapi>=0.110", "uvicorn>=0.27"]
# Optional LLM providers. The MVP runs without any of these.
llm = ["httpx>=0.27"]
# Deterministic local WAV auditions (no Ardour or external model required).
preview = ["numpy>=1.26"]
# Optional richer MIDI / audio analysis.
audio = ["pretty_midi>=0.2.10", "numpy>=1.26", "librosa>=0.10", "soundfile>=0.12", "pyloudnorm>=0.1"]
# Reference source separation (Demucs). Install torch first from the CUDA index:
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu128
separation = ["demucs>=4.0", "librosa>=0.10", "soundfile>=0.12"]
# Development tooling.
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
seion-music = "app.cli.seion_music:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "connectors/ardour/tests"]
pythonpath = [".", "connectors/ardour/python"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
