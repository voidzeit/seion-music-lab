name: SEION Python verification

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: ruff check app tests connectors/ardour/python connectors/ardour/tests
      - name: Generate Project 001 prototypes
        run: python -m app.music.prototype_lab --out "$RUNNER_TEMP/project001-a-b-c"
      - name: Upload Project 001 editable MIDI prototypes
        uses: actions/upload-artifact@v4
        with:
          name: seion-project001-abc-midi
          path: ${{ runner.temp }}/project001-a-b-c/
          retention-days: 14
          if-no-files-found: error
