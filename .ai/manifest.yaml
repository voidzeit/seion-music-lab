project:
  name: SEION Music Lab
  type: local-first MIDI composition and experimental audio production
  status: experimental
commands:
  install: ['python -m pip install -e ".[dev]"']
  test: ['python -m pytest -q']
  lint: ['ruff check app tests connectors/ardour/python connectors/ardour/tests']
  run: ['seion-music --help', 'python -m app.music.prototype_lab --out <empty-directory>']
source_of_truth:
  memory_root: .ai
  canonical: [.ai/manifest.yaml, .ai/state.md, .ai/decisions.md, .ai/tasks.md, .ai/tests.md]
runtime_paths: [.ai/runtime/, .ai/machine/, .ai/graph.md, .ai/packs/quick.md]
